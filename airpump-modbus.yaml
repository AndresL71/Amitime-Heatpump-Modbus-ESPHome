  # Derivados amigables desde RAW (no escriben Modbus)
  - platform: template
    name: "HP Ambient Start AF#1 (°C)"
    id: hp_amb_start_af1_deg
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float raw = id(hp_amb_start_af1_raw).state;
      if (isnan(raw)) return NAN;
      return (raw - 3000.0f) / 100.0f;

  - platform: template
    name: "HP Ambient Start AF#2 (°C)"
    id: hp_amb_start_af2_deg
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float raw = id(hp_amb_start_af2_raw).state;
      if (isnan(raw)) return NAN;
      return (raw - 3000.0f) / 100.0f;

  - platform: template
    name: "HP Ambient Stop AF#2 (°C)"
    id: hp_amb_stop_af2_deg
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float raw = id(hp_amb_stop_af2_raw).state;
      if (isnan(raw)) return NAN;
      return (raw - 3000.0f) / 100.0f;

  - platform: template
    name: "HP Auto Heat Activ Ambient (°C)"
    id: hp_auto_heat_activ_amb_deg
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float raw = id(hp_auto_heat_activ_amb_raw).state;
      if (isnan(raw)) return NAN;
      return (raw - 3000.0f) / 100.0f;

  - platform: template
    name: "HP Shifting Priority Start Temp (°C)"
    id: hp_shift_prio_start_temp_deg
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float raw = id(hp_shift_prio_start_temp_raw).state;
      if (isnan(raw) || raw == 65535.0f) return NAN;
      return (raw - 3000.0f) / 100.0f;

  # Cálculos
  - platform: template
    name: "HP Water ΔT"
    id: hp_water_delta_t
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (isnan(id(hp_outlet_water_temp).state) || isnan(id(hp_inlet_water_temp).state)) return NAN;
      return id(hp_outlet_water_temp).state - id(hp_inlet_water_temp).state;

  - platform: template
    name: "HP Thermal Power"
    id: hp_thermal_power_kw
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float dt = id(hp_water_delta_t).state;
      if (isnan(dt)) return NAN;
      float flow = id(hp_flow_lps).state;
      return 4.18f * flow * dt;

  - platform: template
    name: "HP Electric Power"
    id: hp_electric_power_kw
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float v = id(hp_ac_voltage).state;
      float i = id(hp_ac_current).state;
      float pf = id(hp_power_factor).state;
      if (isnan(v) || isnan(i) || isnan(pf)) return NAN;
      return (v * i * pf) / 1000.0f;

  - platform: template
    name: "HP COP (Instant)"
    id: hp_cop_instant
    unit_of_measurement: ""
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float q = id(hp_thermal_power_kw).state;
      float p = id(hp_electric_power_kw).state;
      if (isnan(q) || isnan(p) || p <= 0.05f) return NAN;
      return q / p;
    filters:
      - clamp:
          min_value: 0.0
          max_value: 20.0

  - platform: template
    name: "HP COP (5min EMA)"
    id: hp_cop_5min
    unit_of_measurement: ""
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float q = id(hp_thermal_power_kw).state;
      float p = id(hp_electric_power_kw).state;
      if (isnan(q) || isnan(p) || p <= 0.05f) return NAN;
      return q / p;
    filters:
      - exponential_moving_average:
          alpha: 0.065
          send_every: 1
      - clamp:
          min_value: 0.0
          max_value: 20.0

