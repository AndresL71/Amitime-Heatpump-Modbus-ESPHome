# file: airpump-modbus.yaml
esphome:
  name: airpump-modbus
  friendly_name: AirPump Modbus

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  ap:
    ssid: "AirPump Fallback Hotspot"
    password: "xxxxxxxx"

captive_portal:

web_server:
  port: 80

api:
  encryption:
    key: !secret esphome_key

ota:
  - platform: esphome
    password: !secret esphome_ota

# =======================
# RS-485 / Modbus RTU
# =======================
uart:
  id: modbus_uart
  tx_pin: GPIO27
  rx_pin: GPIO14
  baud_rate: 19200
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: modbus_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: hp
    modbus_id: modbus1
    address: 0x02
    setup_priority: -10
    command_throttle: 250ms
    update_interval: 2s

# =======================
# SELECT
# =======================
select:
  - platform: modbus_controller
    name: "HP Working Mode"
    id: hp_working_mode_select
    modbus_controller_id: hp
    address: 999     # Excel 1000 → bus 999
    value_type: U_WORD
    optimistic: true
    optionsmap:
      "Standby": 0
      "Hot Water": 1
      "Heating": 2
      "Cooling": 3
      "Auto": 4
      "Hot Water + Heating": 5
      "Hot Water + Cooling": 6
      "Hot Water + Auto": 7

# =======================
# OUTPUT / BUTTON
# =======================
output:
  - platform: modbus_controller
    id: hp_eeprom_save_out
    modbus_controller_id: hp
    address: 1799    # Excel 1800
    register_type: holding
    value_type: U_WORD

button:
  - platform: template
    name: "HP Save to EEPROM"
    on_press:
      - output.turn_on: hp_eeprom_save_out
      - delay: 200ms
      - output.turn_off: hp_eeprom_save_out
      - component.update: hp

