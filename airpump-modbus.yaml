    name: "HP Outdoor Ambient Temp"
    id: hp_outdoor_ambient_temp
    modbus_controller_id: hp
    register_type: holding
    address: 1199
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 2
