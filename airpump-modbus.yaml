# =======================
# TEXT SENSORS
# =======================
text_sensor:
  - platform: template
    name: "HP Mode"
    id: hp_mode_text
    update_interval: 10s
    lambda: |-
      uint16_t v = (uint16_t) id(hp_mode_raw).state;
      uint8_t m = (uint8_t) (v & 0x0007);
      switch (m) {
        case 0: return std::string("Standby");
        case 1: return std::string("Cooling");
        case 2: return std::string("Heating");
        case 3: return std::string("Hot Water");
        case 4: return std::string("Forced Defrost");
        case 5: return std::string("EEPROM Writing");
        case 6: return std::string("Inspection");
        default: return std::string("Reserved");
      }

  - platform: template
    name: "HP Fault Summary"
    id: hp_fault_summary
    update_interval: 10s
    lambda: |-
      std::string s;
      if (id(hp_fail_eeprom).state) s += "[EEPROM FAIL] ";
      if (id(hp_fail_water_flow_prot).state) s += "[WATER FLOW PROT] ";
      if (id(hp_prot_first_antifreeze).state) s += "[ANTIFREEZE#1] ";
      if (id(hp_prot_secondary_antifreeze).state) s += "[ANTIFREEZE#2] ";
      if (id(hp_defrosting).state) s += "[DEFROST] ";
      if (s.empty()) s = "OK";
      return s;
